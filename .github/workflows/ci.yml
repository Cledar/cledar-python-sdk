name: CI Pipeline

on:
  push:
    branches: main
    tags:
      - '*'
  pull_request:

env:
  SONAR_USER_HOME: .sonar
  UV_CACHE_DIR: .cache/uv
  PIP_CACHE_DIR: .cache/pip
  SHIP_ASAP_REGEX: DANGEROUS_SHIP_ASAP

jobs:

  # -------------------------------------------------------
  # Lint: Ruff Format
  # -------------------------------------------------------
  ruff-format:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - name: Install Ruff
        run: |
          pip install uv
          uv sync --no-dev --frozen
          uv add ruff
      - name: Run Ruff Format
        run: uv run ruff format --check --diff .

  # -------------------------------------------------------
  # Lint: Ruff Check
  # -------------------------------------------------------
  ruff-check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - name: Install Ruff
        run: |
          pip install uv
          uv sync --no-dev --frozen
          uv add ruff
      - name: Run Ruff Check
        run: uv run ruff check .

  # -------------------------------------------------------
  # Lint: Mypy (using uv)
  # -------------------------------------------------------
  mypy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - name: Install uv and dependencies
        run: |
          pip install uv
          uv sync --no-dev --frozen
          uv add mypy
      - name: Run Mypy
        run: uv run mypy .

  # -------------------------------------------------------
  # Lint: Darglint (docstring argument validation)
  # -------------------------------------------------------
  darglint-check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - name: Install uv + project deps (no dev)
        run: |
          pip install uv

      - name: Run Darglint (tool run)
        run: |
          find cledar/ -name "*.py" -not -path "*/tests/*" -exec uv tool run darglint {} \;

  # -------------------------------------------------------
  # Test (using uv)
  # -------------------------------------------------------
  test:
    runs-on: self-hosted
    needs: [ruff-format, ruff-check, mypy, darglint-check]
    env:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - name: Install uv and dependencies
        run: |
          pip install uv
          uv sync --frozen
      - name: Run tests
        run: |
          uv run coverage run -m pytest
          uv run coverage xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
