name: CI Pipeline

on:
  push:
    branches: main
    tags:
      - '*'
  pull_request:

env:
  SONAR_USER_HOME: .sonar
  UV_CACHE_DIR: .cache/uv
  PIP_CACHE_DIR: .cache/pip
  SHIP_ASAP_REGEX: DANGEROUS_SHIP_ASAP

jobs:

  # -------------------------------------------------------
  # Lint: Ruff Format
  # -------------------------------------------------------
  ruff-format:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - name: Install Ruff
        run: |
          pip install uv
          uv sync --no-dev --frozen
          uv add ruff
      - name: Run Ruff Format
        run: uv run ruff format --check --diff .

  # -------------------------------------------------------
  # Lint: Ruff Check
  # -------------------------------------------------------
  ruff-check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - name: Install Ruff
        run: |
          pip install uv
          uv sync --no-dev --frozen
          uv add ruff
      - name: Run Ruff Check
        run: uv run ruff check .

  # -------------------------------------------------------
  # Lint: Mypy (using uv)
  # -------------------------------------------------------
  mypy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - name: Install uv and dependencies
        run: |
          pip install uv
          uv sync --no-dev --frozen
          uv add mypy
      - name: Run Mypy
        run: uv run mypy .

  # -------------------------------------------------------
  # Lint: Docstring Check (pydocstyle + darglint)
  # -------------------------------------------------------
  docstring-check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - name: Install tools
        run: |
          pip install uv
          uv sync --no-dev --frozen
          uv add pydocstyle darglint
      - name: Check docstrings (PR mode)
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.py$' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Checking changed files:"
            echo "$CHANGED_FILES"
            echo "$CHANGED_FILES" | xargs uv run pydocstyle
            echo "$CHANGED_FILES" | xargs -I {} uv run darglint {}
          else
            echo "No Python files changed"
          fi
      - name: Check docstrings (Full mode)
        if: github.event_name == 'pull_request'
        run: |
          uv run pydocstyle cledar/
          find cledar/ -name "*.py" -exec uv run darglint {} \;

  # -------------------------------------------------------
  # Test (using uv)
  # -------------------------------------------------------
  test:
    runs-on: self-hosted
    needs: [ruff-format, ruff-check, mypy, docstring-check]
    env:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - name: Install uv and dependencies
        run: |
          pip install uv
          uv sync --frozen
      - name: Run tests
        run: |
          uv run coverage run -m pytest
          uv run coverage xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
