name: Release (PyPI)

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "Setting version to $version"
          sed -i "s/^version = \".*\"/version = \"$version\"/" pyproject.toml

      - name: Set up uv (Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
