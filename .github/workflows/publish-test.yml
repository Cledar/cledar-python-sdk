name: Publish to TestPyPI (branch-based)

on:
  push:
    branches:
      - CPL-8-implement-cicd-for-package-publication-in-py-pi

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  release:
    runs-on: self-hosted
    concurrency:
      group: release-test
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools & semantic-release
        run: |
          python -m pip install --upgrade pip
          pip install python-semantic-release uv hatch twine

      - name: Run semantic release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version

      - name: Publish to TestPyPI with twine
        run: |
          twine upload --repository testpypi dist/* --verbose
